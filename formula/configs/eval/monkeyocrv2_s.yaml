model:
  arch: unimernet
  model_type: unimernet
  model_config:
    model_name: ./models/unimernet_tiny
    max_seq_len: 1536
    encoder_backend: monkeyocrv2
    monkey_encoder_path: ./models/monkeyocrv2_vit
    monkey_use_native_token_order: True
    monkey_use_adapter_bridge: False
    freeze_encoder: False

  load_pretrained: False
  load_finetuned: True
  finetuned: "./model_weight/monkeyocrv2_s_formula.pth"
  tokenizer_config:
    path: ./models/unimernet_tiny
datasets:
  formula_rec_eval:
    vis_processor:
      eval:
        name: "formula_image_monkey_native_fixed_eval"
        image_size: [196, 672]
        crop_margin: True
    text_processor:
      eval:
        name: "blip_caption"
        max_words: 1536
    build_info:
      images:
        - ./data/UniMER-Test/cpe
        - ./data/UniMER-Test/hwe
        - ./data/UniMER-Test/sce
        - ./data/UniMER-Test/spe
      annotation:
        - ./data/UniMER-Test/cpe.txt
        - ./data/UniMER-Test/hwe.txt
        - ./data/UniMER-Test/sce.txt
        - ./data/UniMER-Test/spe.txt

run:
  runner: runner_iter
  task: unimernet_train
  lr_sched: "linear_warmup_cosine_lr"
  init_lr: 1e-4
  encoder_lr_scale: 0.1
  decoder_lr_scale: 1.0
  enc_to_dec_proj_lr_scale: 1.0
  min_lr: 1e-8
  warmup_lr: 1e-5
  weight_decay: 0.05
  batch_size_train: 16
  batch_size_eval: 256
  accum_grad_iters: 1
  num_workers: 8
  warmup_steps: 5000
  iters_per_inner_epoch: 1
  max_iters: 1
  milestone: []
  seed: 42
  output_dir: "../outputs/eval_monkeyocrv2_s"
  amp: True
  resume_ckpt_path: null
  evaluate: True
  train_splits: []
  valid_splits: ["eval"]
  test_splits: []
  use_dist_eval_sampler: True
  device: "cuda"
  world_size: 1
  dist_url: "env://"
  distributed: True
  distributed_type: ddp
  generate_cfg:
    temperature: 0.0
